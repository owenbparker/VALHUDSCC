<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>SCC VAL Overwolf Link</title>
<style>
  body { margin: 0; padding: 18px 20px; background: #111318; color: #e8eaf0; font: 13px/1.45 "Segoe UI", system-ui, sans-serif; }
  h1 { font-size: 16px; margin: 0 0 14px; }
  .row { display: flex; gap: 10px; align-items: flex-start; margin: 8px 0; }
  .dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 5px; flex: 0 0 auto; background: #666; }
  .ok { background: #3ecf8e; } .bad { background: #ff5a5f; } .wait { background: #f5b942; }
  label { display: block; margin: 16px 0 4px; color: #9aa0ad; }
  input[type=text] { width: 100%; box-sizing: border-box; padding: 7px 9px; border-radius: 6px; border: 1px solid #2c303a; background: #1a1d24; color: inherit; font: inherit; }
  .small { color: #9aa0ad; font-size: 12px; }
  .check { display: flex; gap: 8px; align-items: center; margin-top: 14px; color: #c6cad4; }
</style>
</head>
<body>
<h1>SCC VAL Overwolf Link</h1>
<div class="row"><span class="dot" id="d-gep"></span><span id="gep"></span></div>
<div class="row"><span class="dot" id="d-game"></span><span id="game"></span></div>
<div class="row"><span class="dot" id="d-hud"></span><span id="hud"></span></div>
<div class="small" id="counts"></div>
<label for="url">SCC VAL HUD address</label>
<input type="text" id="url" spellcheck="false">
<div class="small">Leave as localhost when the HUD (GFX Controller or Observer Client) runs on this PC.</div>
<label class="check"><input type="checkbox" id="test"> Use Overwolf's test channel for game events (restarts)</label>
<script>
  const $ = id => document.getElementById(id);
  let typing = false;
  $("url").addEventListener("focus", () => typing = true);
  $("url").addEventListener("blur", () => { typing = false; window.link.setHud($("url").value); });
  $("url").addEventListener("keydown", e => { if (e.key === "Enter") $("url").blur(); });
  $("test").addEventListener("change", () => window.link.setTestChannel($("test").checked));
  window.link.onStatus(s => {
    $("gep").textContent = s.gep;
    $("game").textContent = s.game;
    $("hud").textContent = s.hud || "Waiting to send";
    $("d-gep").className = "dot " + (/ready/.test(s.gep) ? "ok" : /error|failed|crashed|no Overwolf/.test(s.gep) ? "bad" : "wait");
    $("d-game").className = "dot " + (/detected/.test(s.game) ? "ok" : /administrator/.test(s.game) ? "bad" : "wait");
    $("d-hud").className = "dot " + (/^Sending/.test(s.hud) ? "ok" : s.hud ? "bad" : "wait");
    $("counts").textContent = `${s.sent} sent, ${s.failed} failed` + (s.features && s.features.length ? ` · features: ${s.features.join(", ")}` : "");
    if (!typing) $("url").value = s.hudUrl;
    $("test").checked = !!s.testChannel;
  });
</script>
</body>
</html>
