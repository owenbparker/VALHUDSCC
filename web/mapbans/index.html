<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Map bans</title>
<!--
  The map bans graphic (1920x1080, transparent): /map-bans?bo=1 or ?bo=3.
  Rebuilt from the vMix titles "Bo1 Map Bans VAL" and "MAP BANS" (Bo3): the
  same layout, fonts and fly-in from the bottom, one column at a time. The
  maps come live from the control panel's Map Bans page.
-->
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
  .stage { position: absolute; left: 1px; top: 0; width: 1920px; height: 1080px;
           font-family: "Franklin Gothic Medium", "Franklin Gothic", "Libre Franklin", "Arial Narrow", Arial, sans-serif; }
  .title { position: absolute; left: 0; top: 55px; width: 1954px; height: 148px; display: flex; align-items: center; justify-content: center;
           font: 132px "FrankGoth BT", "Franklin Gothic Heavy", "Franklin Gothic Demi", "Franklin Gothic Medium", "Arial Black", sans-serif;
           font-weight: 900; color: #fffbfb; white-space: nowrap; }
  .col { position: absolute; top: 0; width: 264px; height: 1080px; }
  .top, .bottom { position: absolute; left: 0; width: 263px; background: #fff; }
  .top { top: 234px; height: 52px; display: flex; align-items: center; justify-content: center;
         font-size: 30.48px; color: #000; text-transform: uppercase; white-space: nowrap; overflow: hidden; }
  .art { position: absolute; left: 1px; top: 286px; width: 262px; height: 654px; background: #121418 center / cover no-repeat;
         transition: filter .4s; }
  .art.ban { filter: grayscale(1) brightness(.78); }
  /* No picture of the map (yet): its name, big and faint. */
  .art span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; writing-mode: vertical-rl;
              transform: rotate(180deg); font-size: 120px; color: rgba(255, 255, 255, .12); text-transform: uppercase; white-space: nowrap; }
  .bottom { top: 959px; height: 53px; color: #000; }
  .bottom.tall { top: 938px; height: 74px; }
  .label { position: absolute; left: 19px; top: 17px; font-size: 30.48px; line-height: 28px; white-space: nowrap; }
  .label small { font-size: 25.4px; margin-left: 10px; }
  .tall .label { left: 16px; top: 18.5px; font-weight: 600;
                 font-family: "Franklin Gothic Demi", "Franklin Gothic Medium", "Franklin Gothic", Arial, sans-serif; }
  .tall .side { position: absolute; left: 15px; top: 48px; font-size: 25.4px; line-height: 25px; white-space: nowrap; }
  .tall .side b { font-weight: normal; margin-right: 6px; }
  .side i { font-style: normal; font-family: "Franklin Gothic Book", "Franklin Gothic Medium", "Franklin Gothic", Arial, sans-serif; }
  .logo { position: absolute; left: 174.5px; top: 925.25px; width: 97.5px; height: 102.5px; object-fit: contain; }
  .logo[src=""] { display: none; }

  /* The vMix storyboard: MAP BANS zooms in (0.5 s), then each column flies
     up from the bottom, half a second apart. */
  .stage:not(.play) { visibility: hidden; }
  .play .title { animation: zoomfade .8s cubic-bezier(.645, .045, .355, 1) .5s both; }
  .play .col { animation: fly .8s cubic-bezier(.645, .045, .355, 1) both; }
  @keyframes zoomfade { from { transform: scale(0); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes fly { from { transform: translateY(860px); } to { transform: none; } }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="title">MAP BANS</div>
</div>
<script>
(function () {
  "use strict";
  const bo = new URLSearchParams(location.search).get("bo") === "1" ? "1" : "3";
  const X = [12, 283, 556, 828, 1099, 1372, 1643];   // each column, from the titles
  const stage = document.getElementById("stage");
  const cols = X.map((x, i) => {
    const c = document.createElement("div");
    c.className = "col";
    c.style.left = x + "px";
    c.style.animationDelay = (1 + i * 0.5) + "s";
    c.innerHTML = '<div class="art"></div><div class="top"></div><div class="bottom"><div class="label"></div><div class="side"></div></div><img class="logo" src="" alt="">';
    const logo = c.querySelector(".logo");   // (a team without a logo: nothing, not a broken picture)
    logo.onerror = () => { logo.style.visibility = "hidden"; };
    logo.onload = () => { logo.style.visibility = ""; };
    stage.appendChild(c);
    return c;
  });
  const esc = t => String(t == null ? "" : t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const SIDE = { attack: "Attack", defence: "Defence" };
  let shown = "";

  function render(v) {
    const key = JSON.stringify(v);
    if (key === shown) return;
    shown = key;
    v.steps.forEach((s, i) => {
      const c = cols[i], team = s.team ? v.teams[s.team] : null, chooser = s.side_team ? v.teams[s.side_team] : null;
      const art = c.querySelector(".art"), want = s.art ? `url("${s.art}")` : "";
      if (art.dataset.src !== want) {
        art.dataset.src = want;
        art.style.backgroundImage = want;
        art.innerHTML = s.map ? `<span>${esc(s.map)}</span>` : "";
        if (s.art) {
          const probe = new Image();
          probe.onload = () => { if (art.dataset.src === want) art.innerHTML = ""; };
          probe.src = s.art;
        }
      }
      art.classList.toggle("ban", s.action === "ban");
      c.querySelector(".top").textContent = s.map || "";
      const tall = s.action !== "ban";
      c.querySelector(".bottom").classList.toggle("tall", tall);
      c.querySelector(".label").innerHTML = s.action === "ban" ? `BAN<small>${esc(team && team.tricode)}</small>`
        : s.action === "pick" ? "MAP PICK" : "DECIDER";
      c.querySelector(".side").innerHTML = tall && chooser && s.side ? `<b>${esc(chooser.tricode)}</b><i>${SIDE[s.side]}</i>` : "";
      const logo = c.querySelector(".logo"), src = s.action === "pick" && team && team.logo ? "/" + team.logo : "";
      if (logo.getAttribute("src") !== src) logo.setAttribute("src", src);
    });
    stage.classList.add("play");   // (the first data starts the storyboard)
  }

  async function poll() {
    try { render(await (await fetch("/api/map-bans?bo=" + bo, { cache: "no-store" })).json()); } catch (e) { /* the HUD is restarting */ }
    setTimeout(poll, 500);
  }
  poll();
})();
</script>
</body>
</html>
