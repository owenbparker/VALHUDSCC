<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agent select (Champions)</title>
<!-- Agent select overlay (browser source, 1920x1080) in the style of the
     Champions 2025 HUD: its fonts, side colours and art. Driven by the app's
     /api/state (agent_select). An agent being hovered shows as a silhouette;
     it fills in when locked. ?fit=1 scales to the window; ?always=1 keeps it
     up (for setting up). -->
<style>
  @font-face { font-family: "Tungsten"; src: url("/hud/Resources/Tungsten-Bold.ttf"); }
  @font-face { font-family: "Gridnik"; src: url("/hud/Resources/FoundryGridnik-Bold.otf"); }
  @font-face { font-family: "GridnikXB"; src: url("/hud/Resources/FoundryGridnik-ExtraBold.otf"); }
  @property --def { syntax: "<color>"; inherits: true; initial-value: #00ffcc; }
  @property --atk { syntax: "<color>"; inherits: true; initial-value: #ff4e5d; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
  * { box-sizing: border-box; }
  #select { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; color: #fff;
            transition: --def .8s, --atk .8s; }
  /* Up when agent select starts, back down when it ends. */
  #panel { position: absolute; left: 0; right: 0; bottom: 0; height: 440px;
           transform: translateY(105%); transition: transform .6s cubic-bezier(.6,0,.8,.4); }
  #select.On #panel { transform: none; transition: transform .8s cubic-bezier(.2,.8,.2,1); }
  #panel::before { content: ""; position: absolute; inset: 60px 0 0 0;
                   background: linear-gradient(to bottom, rgba(8,9,13,.0) 0%, rgba(8,9,13,.88) 22%, rgba(8,9,13,.96) 100%); }

  /* --- team headers --- */
  .head { position: absolute; top: 40px; height: 64px; display: flex; align-items: center; gap: 16px; }
  .head.left { left: 34px; }
  .head.right { right: 34px; flex-direction: row-reverse; }
  .head img { height: 58px; width: 58px; object-fit: contain; }
  .head .name { font: 64px/1 "Tungsten", sans-serif; letter-spacing: .01em; text-transform: uppercase; white-space: nowrap;
                max-width: 470px; overflow: hidden; }
  .head .side { font: 16px/1 "Gridnik", sans-serif; letter-spacing: .14em; padding: 6px 10px 5px; border: 1.5px solid currentColor; }

  /* --- agent cards --- */
  .cards { position: absolute; top: 118px; display: flex; gap: 6px; }
  .cards.left { left: 34px; }
  .cards.right { right: 34px; }
  .card { position: relative; width: 148px; height: 300px; overflow: hidden; background: #111318;
          clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 0 100%); }
  .cards.right .card { clip-path: polygon(0 18px, 18px 0, 100% 0, 100% 100%, 0 100%); }
  .card::before { content: ""; position: absolute; inset: 0;
                  background: linear-gradient(to top, color-mix(in srgb, var(--side) 32%, transparent) 0%, transparent 60%);
                  opacity: .35; transition: opacity .4s; }
  .card.Locked::before { opacity: 1; }
  .card .art { position: absolute; left: 50%; top: -6px; height: 330px; transform: translateX(-50%);
               opacity: 0; transition: opacity .35s ease, filter .45s ease; }
  .cards.right .card .art { transform: translateX(-50%) scaleX(-1); }
  .card.Hover .art, .card.Locked .art { opacity: 1; }
  /* Hovering: the agent's silhouette, and the card's edge pulses. */
  .card.Hover .art { filter: brightness(0) invert(1) opacity(.3) drop-shadow(0 0 10px rgba(255,255,255,.35)); }
  .card .edge { position: absolute; inset: 0; border: 2px solid var(--side); opacity: 0; pointer-events: none; }
  .card.Hover .edge { animation: pulse 1.1s ease-in-out infinite; }
  .card .shade { position: absolute; left: 0; right: 0; bottom: 0; height: 120px;
                 background: linear-gradient(to top, rgba(8,9,13,.95) 25%, rgba(8,9,13,0)); }
  .card .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: var(--side);
               transform: scaleX(0); transform-origin: left; transition: transform .45s cubic-bezier(.2,.8,.2,1); }
  .cards.right .card .bar { transform-origin: right; }
  .card.Locked .bar { transform: none; }
  .card .agent { position: absolute; left: 12px; right: 12px; bottom: 44px; font: 14px/1 "Gridnik", sans-serif;
                 letter-spacing: .12em; text-transform: uppercase; color: var(--side); white-space: nowrap; }
  /* (Long names shrink to fit: see fit().) */
  .card .player { position: absolute; left: 10px; right: 8px; bottom: 16px; font: 24px/1 "GridnikXB", sans-serif;
                  white-space: nowrap; overflow: hidden; }
  .cards.right .card .agent, .cards.right .card .player { text-align: right; }
  .card .empty { position: absolute; left: 50%; top: 92px; transform: translateX(-50%); font: 64px/1 "Tungsten", sans-serif;
                 color: rgba(255,255,255,.08); transition: opacity .3s; }
  .card.Hover .empty, .card.Locked .empty { opacity: 0; }

  /* --- the map --- */
  .map { position: absolute; left: 50%; top: 40px; width: 320px; height: 378px; transform: translateX(-50%); }
  .map .label { text-align: center; font: 16px/1 "Gridnik", sans-serif; letter-spacing: .3em; color: rgba(255,255,255,.65); }
  .map .art { position: absolute; top: 28px; left: 0; width: 320px; height: 250px; background: #111318 center / cover no-repeat;
              clip-path: polygon(18px 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 0 100%, 0 18px); transition: opacity .4s; }
  .map .art::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(8,9,13,.9), rgba(8,9,13,0) 60%); }
  .map .name { position: absolute; top: 196px; left: 0; right: 0; text-align: center; font: 76px/1 "Tungsten", sans-serif;
               text-transform: uppercase; letter-spacing: .02em; text-shadow: 0 2px 12px rgba(0,0,0,.6); }
  .map .timer { position: absolute; top: 292px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; }
  .map .timer .secs { font: 64px/1 "Tungsten", sans-serif; min-width: 70px; text-align: center; }
  .map .timer .tag { font: 13px/1.3 "Gridnik", sans-serif; letter-spacing: .14em; color: rgba(255,255,255,.6); text-transform: uppercase; }
  .map .vs { position: absolute; top: 106px; font: 40px/1 "Tungsten", sans-serif; color: rgba(255,255,255,.12); }

  @keyframes pulse { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
</style>
</head>
<body>
<div id="select">
  <div id="panel">
    <div class="head left"><img id="logo-left" alt=""><div class="name" id="name-left"></div><div class="side" id="side-left"></div></div>
    <div class="head right"><img id="logo-right" alt=""><div class="name" id="name-right"></div><div class="side" id="side-right"></div></div>
    <div class="cards left" id="cards-left"></div>
    <div class="map">
      <div class="label" id="map-label">MAP</div>
      <div class="art" id="map-art"></div>
      <div class="name" id="map-name"></div>
      <div class="timer"><div class="tag">Agent<br>select</div><div class="secs" id="secs"></div><div class="tag" id="locked">0/10<br>locked</div></div>
    </div>
    <div class="cards right" id="cards-right"></div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const url = p => "/" + String(p || "").split("/").map(encodeURIComponent).join("/");

if (params.get("fit") === "1") {
  const fit = () => {
    const k = Math.min(innerHeight / 1080, innerWidth / 1920);
    Object.assign(document.body.style, { transformOrigin: "0 0", transform: `translateX(${(innerWidth - 1920 * k) / 2}px) scale(${k})` });
  };
  addEventListener("resize", fit); fit();
}

const cards = {};
for (const side of ["left", "right"]) {
  cards[side] = [];
  for (let i = 0; i < 5; i++) {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = '<div class="empty">?</div><img class="art" alt=""><div class="shade"></div><div class="edge"></div>' +
                     '<div class="agent"></div><div class="player"></div><div class="bar"></div>';
    $(`cards-${side}`).appendChild(card);
    cards[side].push({ card, art: card.querySelector(".art"), agent: card.querySelector(".agent"), player: card.querySelector(".player") });
  }
}
function setSrc(img, src) { if (img.getAttribute("src") !== src) img.setAttribute("src", src); }

// Text that shrinks until it fits its box (whole names, never cut off).
function fitText(el, text, base, min) {
  if (el.dataset.text === text && el.dataset.fitted) return;
  el.dataset.text = text;
  el.textContent = text;
  let size = base;
  el.style.fontSize = size + "px";
  while (el.scrollWidth > el.clientWidth + 0.5 && size > min) el.style.fontSize = (size -= 1) + "px";
  el.dataset.fitted = document.fonts.status === "loaded" ? "1" : "";
}
// Measured again once the fonts are in (sizes change with them).
document.fonts.ready.then(() => document.querySelectorAll("[data-text]").forEach(el => { el.dataset.fitted = ""; }));

function render(s) {
  const a = s.agent_select || {}, cfg = s.config;
  $("select").classList.toggle("On", !!a.active || params.get("always") === "1");
  const def = cfg.defense_color || "#00ffcc", atk = cfg.attack_color || "#ff4e5d";
  $("select").style.setProperty("--def", def);
  $("select").style.setProperty("--atk", atk);
  const attacker = cfg.attack_first || "left";
  let locked = 0;
  for (const side of ["left", "right"]) {
    const team = cfg[side] || {}, attacking = side === attacker;
    fitText($(`name-${side}`), team.name || "", 64, 34);
    const logo = $(`logo-${side}`);
    logo.style.display = team.logo ? "" : "none";
    if (team.logo) setSrc(logo, url(team.logo));
    $(`side-${side}`).textContent = attacking ? "ATTACK" : "DEFEND";
    $(`side-${side}`).style.color = attacking ? "var(--atk)" : "var(--def)";
    $(`cards-${side}`).style.setProperty("--side", attacking ? "var(--atk)" : "var(--def)");
    ((a.players || {})[side] || []).forEach((p, i) => {
      const v = cards[side][i];
      if (p.agent) setSrc(v.art, `/select/Resources/Agentes/${p.agent}/${p.agent}.png`);
      v.card.classList.toggle("Hover", !!p.agent && !p.locked);
      v.card.classList.toggle("Locked", !!p.agent && !!p.locked);
      v.agent.textContent = p.agent === "Kayo" ? "KAY/O" : p.agent || "";
      fitText(v.player, p.name || "", 24, 8);
      if (p.agent && p.locked) locked++;
    });
  }
  const maps = cfg.maps || [], i = Number(cfg.current_map) || 0;
  $("map-label").textContent = maps.length > 1 ? `MAP ${i + 1}` : "MAP";
  $("map-name").textContent = a.map || "";
  $("map-art").style.backgroundImage = a.map ? `url("/hud/Resources/Maps/${a.map}.png")` : "none";
  $("secs").textContent = a.active && a.timer ? a.timer : "";
  $("locked").innerHTML = `${locked}/10<br>locked`;
}

async function poll() {
  try { render(await (await fetch("/api/state", { cache: "no-store" })).json()); } catch (e) { /* app restarting */ }
  setTimeout(poll, 250);
}
poll();
</script>
</body>
</html>
