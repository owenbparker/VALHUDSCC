# Builds the VALORANT HUD desktop app (ValorantHUD.exe) on Windows and publishes
# it as a GitHub release (v1.0.<run number>) with ValorantHUD-windows.zip.
# The app checks the latest release on launch and offers to update itself.
# Each release also gets SCC-VAL-HUD-Setup.exe, an installer that downloads
# the latest release from GitHub when it runs.
#
# A commit with [no release] in its message builds and tests without publishing.
#
# Every run also leaves the zip on the run's summary page (Actions tab).
name: Build Windows app

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      VERSION: v1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements-windows.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Read a real spectator screenshot (agents, weapons, text)
        # The Tab scoreboard open: every player's agent, name, weapon, credits, ult and K/D/A.
        run: |
          python -m valhud.reader tests/fixtures/tab_scoreboard.png --expect tests/fixtures/tab_scoreboard.json
          if ($LASTEXITCODE) { exit 1 }

      - name: Stamp the version
        shell: pwsh
        run: |
          Set-Content valhud/version.py "VERSION = `"$env:VERSION`"" -Encoding utf8
          Get-Content valhud/version.py

      - name: Build ValorantHUD.exe
        run: pyinstaller --noconfirm ValorantHUD.spec

      - name: Smoke test the built app
        shell: pwsh
        run: |
          $app = "dist\ValorantHUD"
          $p = Start-Process "$app\ValorantHUD.exe" -ArgumentList '--smoke-test', '--port', '8797' -PassThru -Wait
          Get-Content "$app\smoke-test.txt"
          if ($p.ExitCode -ne 0) { throw "Smoke test failed (exit code $($p.ExitCode))" }
          # Leave no test leftovers in the download.
          Remove-Item "$app\smoke-test.txt", "$app\config.json" -ErrorAction SilentlyContinue
          Remove-Item "$app\output", "$app\_update" -Recurse -ErrorAction SilentlyContinue

      - name: Check the HUD-on-game window (see-through and click-through)
        # Puts a red window on screen with the HUD window over it, then checks
        # the red shows through, the HUD is drawn and clicks pass through.
        # Run in Windows' light and dark mode (dark mode adds a backdrop).
        timeout-minutes: 8
        shell: pwsh
        run: |
          $app = "dist\ValorantHUD"
          $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize"
          New-Item $key -Force | Out-Null
          New-Item overlay-test -ItemType Directory -Force | Out-Null
          $failed = @()
          foreach ($theme in @(@{ name = "light"; v = 1 }, @{ name = "dark"; v = 0 })) {
            Set-ItemProperty $key AppsUseLightTheme $theme.v -Type DWord
            Set-ItemProperty $key SystemUsesLightTheme $theme.v -Type DWord
            $p = Start-Process "$app\ValorantHUD.exe" -ArgumentList '--overlay-test', '--demo', '--port', '8796' -PassThru
            if (-not $p.WaitForExit(150000)) { $p.Kill(); Write-Host "Timed out" }
            Get-ChildItem "$app\overlay-test*" | ForEach-Object { Move-Item $_.FullName "overlay-test\$($theme.name)-$($_.Name)" -Force }
            Write-Host "--- $($theme.name) mode"
            Get-Content "overlay-test\$($theme.name)-overlay-test.txt" -ErrorAction SilentlyContinue
            if ($p.ExitCode -ne 0) { $failed += $theme.name }
          }
          Set-ItemProperty $key AppsUseLightTheme 1 -Type DWord
          Remove-Item "$app\config.json" -ErrorAction SilentlyContinue
          Remove-Item "$app\output", "$app\_update" -Recurse -ErrorAction SilentlyContinue
          if ($failed) { throw "HUD window check failed in $($failed -join ', ') mode" }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: overlay-test
          path: overlay-test

      - name: Add readme and version.txt
        shell: pwsh
        run: |
          Copy-Item README.md dist\ValorantHUD\
          # (the SCC HUD Manager reads the installed version from it)
          Set-Content dist\ValorantHUD\version.txt $env:VERSION -NoNewline

      - uses: actions/upload-artifact@v4
        with:
          name: ValorantHUD-windows
          path: dist/ValorantHUD

      - name: Build the installer
        if: "!contains(github.event.head_commit.message, '[no release]')"
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          & $iscc "/DAppVersion=$($env:VERSION.TrimStart('v'))" installer\SCC-VAL-HUD.iss
          if ($LASTEXITCODE) { exit 1 }

      - name: Publish release
        if: "!contains(github.event.head_commit.message, '[no release]')"
        # The app zip and the installer go up together, so the latest release
        # always has both (the installer link never 404s mid-build).
        shell: pwsh
        run: |
          Compress-Archive -Path dist\ValorantHUD\* -DestinationPath ValorantHUD-windows.zip
          $notes = git log -1 --format=%B | Where-Object { $_ -notmatch '^(Co-Authored-By|Claude-Session):' }
          $notes = ($notes -join "`n").Trim()
          gh release create "$env:VERSION" ValorantHUD-windows.zip dist\SCC-VAL-HUD-Setup.exe --target "${{ github.sha }}" --title "VALORANT HUD $env:VERSION" --notes "$notes"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Test the installer (silent; installs the release just published)
        if: "!contains(github.event.head_commit.message, '[no release]')"
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\SCC VAL HUD test"
          $installArgs = '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$dir`"", '/MERGETASKS="!desktopicon"', '/LOG=install.log'
          $p = Start-Process dist\SCC-VAL-HUD-Setup.exe -ArgumentList $installArgs -PassThru -Wait
          Get-Content install.log -Tail 25
          if ($p.ExitCode -ne 0) { throw "Installer failed (exit code $($p.ExitCode))" }
          if (-not (Test-Path "$dir\ValorantHUD.exe")) { throw "ValorantHUD.exe wasn't installed" }
          if (-not (Test-Path "$dir\_internal")) { throw "_internal wasn't installed" }
          Write-Host "Installed OK to $dir"
